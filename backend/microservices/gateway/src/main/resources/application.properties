# Service
spring.application.name=gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.jersey.enabled=false
eureka.instance.prefer-ip-address=true

# Dynamic routes via Eureka service names: /candidat/**, /job/**, ...
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Explicit routes (paths kept as-is on target services)
spring.cloud.gateway.routes[0].id=candidat-service
spring.cloud.gateway.routes[0].uri=lb://candidat
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/candidates/**,/api/addresses/**

spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=lb://job
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/jobs/**,/api/categories/**

spring.cloud.gateway.routes[2].id=candidature-service
spring.cloud.gateway.routes[2].uri=lb://candidature
spring.cloud.gateway.routes[2].predicates[0]=Path=/mic3/candidature/**

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
management.info.env.enabled=true

info.app.name=gateway
info.app.version=1.0.0
info.app.description=API Gateway Spring Cloud
